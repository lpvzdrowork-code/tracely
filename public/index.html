<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f0f0f" />
  <title>Tracely</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>

  <div id="authOverlay" class="auth-overlay">
    <form id="authForm" class="auth-box">
      <div class="auth-mark">Tracely</div>
      <p class="auth-sub">Enter your access key to view logs</p>
      <input id="authInput" type="password" placeholder="Tracely key" autocomplete="off" autofocus />
      <button type="submit">Unlock</button>
      <p id="authError" class="auth-error" hidden>Incorrect key. Try again.</p>
    </form>
  </div>

  <div id="app" class="app" hidden>
    <header class="topbar">
      <div class="brand-group">
        <div class="brand">Tracely</div>
        <span class="brand-tag">log monitor</span>
      </div>
      <div class="status">
        <span class="dot" id="liveDot"></span>
        <span id="lastUpdated">waiting for data…</span>
      </div>
    </header>

    <main class="main">
      <div class="layout">
        <div class="sidebar-col">
          <aside class="sidebar">
            <h2 class="section-title">Filters</h2>

            <div class="filter-group">
              <span class="filter-label">Level</span>
              <div class="level-chips">
                <label class="level-chip" data-level="INFO">
                  <input type="checkbox" class="level-checkbox" value="INFO" />
                  <span>Info</span>
                </label>
                <label class="level-chip" data-level="WARN">
                  <input type="checkbox" class="level-checkbox" value="WARN" />
                  <span>Warn</span>
                </label>
                <label class="level-chip" data-level="ERROR">
                  <input type="checkbox" class="level-checkbox" value="ERROR" />
                  <span>Error</span>
                </label>
              </div>
            </div>

            <div class="filter-group">
              <span class="filter-label">Game ID</span>
              <input id="gameIdFilter" type="text" placeholder="Any game…" inputmode="numeric" />
            </div>

            <div class="filter-group">
              <span class="filter-label">Time range</span>
              <div class="time-range">
                <input id="startTimeFilter" type="datetime-local" aria-label="Start time" />
                <span class="time-sep">to</span>
                <input id="endTimeFilter" type="datetime-local" aria-label="End time" />
              </div>
            </div>

            <div class="filters-divider"></div>

            <div class="filters-actions-row">
              <button id="applyFilters">Apply</button>
              <button id="clearFilters" class="ghost">Clear</button>
            </div>
          </aside>
        </div>

        <div class="content">
          <section class="stats">
            <div class="stat-card stat-info">
              <span class="stat-label">Info</span>
              <span class="stat-value" id="statInfo">0</span>
            </div>
            <div class="stat-card stat-warn">
              <span class="stat-label">Warn</span>
              <span class="stat-value" id="statWarn">0</span>
            </div>
            <div class="stat-card stat-error">
              <span class="stat-label">Error</span>
              <span class="stat-value" id="statError">0</span>
            </div>
          </section>

          <section class="chart-section">
            <h2 class="section-title">Activity — last 24 hours</h2>
            <div class="chart-wrap">
              <canvas id="activityChart"></canvas>
            </div>
          </section>

          <section class="log-feed-wrap">
            <div class="log-feed-header">
              <span>Time</span>
              <span>Game ID</span>
              <span>Level</span>
              <span>Message</span>
              <span class="log-feed-total" id="logTotal"></span>
            </div>
            <div class="log-feed" id="logFeed">
              <p class="empty-state" id="emptyState" hidden>No logs match these filters yet.</p>
            </div>
          </section>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script src="/app.js"></script>
</body>
</html>
